<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in · Outset Ready</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <a class="login-brand" href="/login" aria-label="Outset Ready sign in">
        <img class="brand-mark" src="{{ url_for('static', path='/outset-mark.svg') }}" alt="">
        <span>Outset <strong>Ready</strong></span>
      </a>
      <section class="login-card">
        <p class="eyebrow">Private owner access</p>
        <h1>Welcome back</h1>
        <p class="lede">Sign in to your private Ready workspace.</p>
        {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
        <form method="post" action="/login">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <input type="hidden" name="next" value="{{ next }}">
          <label>
            Email
            <input type="email" name="email" autocomplete="username" required autofocus>
          </label>
          <label>
            Password
            <input type="password" name="password" autocomplete="current-password" required>
          </label>
          <button class="primary-button" type="submit">Sign in</button>
        </form>
      </section>
      <p class="login-note">One private owner for V1. Public accounts remain out of scope.</p>
    </main>
  </body>
</html>
